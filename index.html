<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STORE TV</title>
<style>
  *{box-sizing:border-box}
  body{background:#101010;color:#fff;font-family:Arial,sans-serif;margin:0;padding:0}
  /* HEADER - TIDAK STICKY LAGI BIAR GAK NUTUPIN BANNER */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;background:#0a0a0a}
  .logo{font-size:28px;font-weight:900}
  .logo span{color:#ff5722}
  .search{background:#222;border:3px solid #333;border-radius:999px;padding:12px 20px;color:#fff;width:300px;font-size:16px;outline:none}
  /* FOKUS REMOTE - INI KUNCINYA */
  .focusable:focus{border-color:#fff !important;background:#333 !important;outline:3px solid #fff !important;outline-offset:3px;transform:scale(1.05);box-shadow:0 0 0 4px #ff5722, 0 10px 30px rgba(0,0,0,.6)}
  .hero{margin:16px 32px 0;background:linear-gradient(90deg,#ff5722,#ff8a50);border-radius:20px;padding:28px 30px;display:flex;justify-content:space-between;align-items:center}
  .hero h1{font-size:32px;margin:0;line-height:1.1}
  .hero p{color:#ffe8dd;margin:8px 0 0}
  .hero button{background:#fff;color:#000;border:none;padding:14px 24px;border-radius:999px;font-weight:900;font-size:16px;cursor:pointer}
  .cats{display:flex;gap:12px;padding:18px 32px 0;overflow-x:auto}
  .cat{background:#222;border:2px solid transparent;padding:12px 22px;border-radius:999px;white-space:nowrap;cursor:pointer;font-weight:bold;color:#fff;font-size:16px}
  .cat.active{background:#fff;color:#000}
  .section{padding:22px 32px 0}
  .section h2{font-size:21px;margin:0 0 14px}
  .row{display:flex;gap:18px;overflow-x:auto;padding:6px 6px 14px;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .card{display:flex;gap:12px;align-items:flex-start;text-align:left;cursor:pointer}
  .card-logo{width:70px;height:70px;border-radius:18px;object-fit:cover;flex-shrink:0}
  .card-info{flex:1}
  .card-info h3{margin:0 0 4px;font-size:18px}
  .card-info p{margin:0 0 6px;font-size:13px;color:#aaa}
  .meta{font-size:12px;color:#888}
  .dl{display:block;background:#1a7f37;color:#fff;text-decoration:none;padding:13px;border-radius:999px;font-weight:900;margin-top:12px;font-size:16px}
  .hint{text-align:center;color:#888;font-size:14px;padding:20px 0 5px}
  .footer{text-align:center;color:#555;font-size:13px;padding:10px 0 30px}
  @media(max-width:600px){.topbar{flex-direction:column;gap:12px}.hero{flex-direction:column;text-align:center;gap:16px}.search{width:100%}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">📺 STORE <span>TV</span></div>
  <input class="search focusable" id="search" placeholder="🔍 Cari aplikasi... (Tekan OK untuk ketik)" tabindex="0">
</div>

<div class="row" id="list">Loading...</div>

<div class="hint">◀ ▲ ▼ ▶ Navigasi &nbsp;•&nbsp; OK = Pilih / Install &nbsp;•&nbsp; Back = Ke Atas</div>
<div class="footer">STORE TV • hgiras.github.io/uupz • v3 Remote Ready</div>

<script>
let allApps = [];
function render(apps, elId){
  const el = document.getElementById(elId);
  el.innerHTML='';
  if(!apps.length){el.innerHTML='<p style="color:#888">Tidak ada aplikasi.</p>';return;}
  apps.forEach(app=>{
    const div = document.createElement('div');
    div.className='card focusable';
    div.tabIndex=0;
    div.innerHTML=`<img src="${app.icon}" onerror="this.src='https://via.placeholder.com/110'" class="card-logo"><div class="card-info"><h3>${app.nama}</h3><p>${app.deskripsi}</p><div class="meta">${app.versi}</div></div>`;
    div.addEventListener('click', ()=>{
      const a=document.createElement('a');
      a.href=app.url;
      a.download='';
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
    div.addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        const a=document.createElement('a');
        a.href=app.url;
        a.download='';
        document.body.appendChild(a);
        a.click();
        a.remove();
      }
    });
    div.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ window.open(app.url, '_blank'); }
    });
    el.appendChild(div);
  });
}
function filter(){
  const q=document.getElementById('search').value.toLowerCase();
  const cat=document.querySelector('.cat.active').dataset.cat;
  let f=allApps.filter(a=>{
    const mq=(a.nama+' '+a.deskripsi).toLowerCase().includes(q);
    const mc=cat==='all' || (a.deskripsi+' '+a.nama).toLowerCase().includes(cat);
    return mq&&mc;
  });
  render(f,'list');
}
fetch('apps.json').then(r=>r.json()).then(apps=>{
  allApps=apps;
  render(apps,'list');
  document.getElementById('search').addEventListener('input', filter);
  document.querySelectorAll('.cat').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.cat').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); filter();
    });
  });
});

// ===== NAVIGASI REMOTE - SPATIAL NAVIGATION =====
document.addEventListener('keydown', e=>{
  const focusables=[...document.querySelectorAll('.focusable')].filter(el=>el.offsetParent!==null);
  const cur=document.activeElement;
  const idx=focusables.indexOf(cur);
  if(idx===-1) return;
  const curRect=cur.getBoundingClientRect();
  let best=null, bestDist=Infinity;
  // Cari elemen terdekat searah panah
  focusables.forEach(el=>{
    if(el===cur) return;
    const r=el.getBoundingClientRect();
    const dx=r.left+r.width/2-(curRect.left+curRect.width/2);
    const dy=r.top+r.height/2-(curRect.top+curRect.height/2);
    let ok=false, dist=Math.hypot(dx,dy);
    if(e.key==='ArrowRight' && dx>20 && Math.abs(dy)<100) ok=true;
    if(e.key==='ArrowLeft' && dx<-20 && Math.abs(dy)<100) ok=true;
    if(e.key==='ArrowDown' && dy>20) ok=true;
    if(e.key==='ArrowUp' && dy<-20) ok=true;
    if(ok && dist<bestDist){ best=el; bestDist=dist; }
  });
  if(best){ e.preventDefault(); best.focus(); best.scrollIntoView({behavior:'smooth', block:'center', inline:'center'}); }
  // Tombol Back di remote TV
  if(e.key==='Backspace' || e.key==='Escape'){ window.scrollTo({top:0, behavior:'smooth'}); document.getElementById('search').focus(); }
});
document.getElementById('btnJelajah').addEventListener('click', ()=>{ document.getElementById('list').scrollIntoView({behavior:'smooth'}); document.querySelector('#list .card').focus(); });
// Auto fokus pertama kali buka di TV
window.addEventListener('load', ()=>{ setTimeout(()=>{ document.querySelector('.cat').focus(); }, 800); });
</script>
</body>
</html>
