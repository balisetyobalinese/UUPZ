name: Build STORE TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'none'

      - name: Build APK
        working-directory: tv-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STORE-TV-APK
          path: tv-app/app/build/outputs/apk/debug/app-store.apk
